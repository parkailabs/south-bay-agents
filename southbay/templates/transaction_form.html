{% extends "base.html" %}

{% block title %}Add Transaction - South Bay Prospecting{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('transactions_list') }}" class="text-gray-500 hover:text-gray-700">
            <i class="fas fa-arrow-left mr-2"></i>Back to Transactions
        </a>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Add Transaction</h1>

        <form method="POST" class="space-y-6">
            <!-- Agent -->
            <div>
                <label for="agent_name" class="block text-sm font-medium text-gray-700">Agent Name *</label>
                <input type="text" name="agent_name" id="agent_name" required list="agents"
                    class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-south-bay-500 focus:ring-south-bay-500"
                    placeholder="Type to search or add new...">
                <datalist id="agents">
                    {% for agent in agents %}
                    <option value="{{ agent.name }}">
                    {% endfor %}
                </datalist>
                <p class="mt-1 text-xs text-gray-500">Select existing or enter new name to create agent</p>
            </div>

            <!-- Transaction Type -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Transaction Type *</label>
                <div class="flex space-x-4">
                    <label class="flex-1 relative">
                        <input type="radio" name="transaction_type" value="listing" required class="sr-only peer">
                        <div class="p-4 border-2 rounded-lg cursor-pointer transition peer-checked:border-blue-500 peer-checked:bg-blue-50 hover:bg-gray-50">
                            <div class="flex items-center justify-center">
                                <i class="fas fa-sign text-2xl text-blue-500 mr-2"></i>
                                <span class="font-medium">Listing</span>
                            </div>
                        </div>
                    </label>
                    <label class="flex-1 relative">
                        <input type="radio" name="transaction_type" value="sale" required class="sr-only peer">
                        <div class="p-4 border-2 rounded-lg cursor-pointer transition peer-checked:border-green-500 peer-checked:bg-green-50 hover:bg-gray-50">
                            <div class="flex items-center justify-center">
                                <i class="fas fa-handshake text-2xl text-green-500 mr-2"></i>
                                <span class="font-medium">Sale</span>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Address -->
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700">Property Address *</label>
                <input type="text" name="address" id="address" required
                    class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-south-bay-500 focus:ring-south-bay-500"
                    placeholder="123 Ocean Ave, Manhattan Beach">
            </div>

            <!-- City & Price Row -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="city" class="block text-sm font-medium text-gray-700">City</label>
                    <select name="city" id="city"
                        class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-south-bay-500 focus:ring-south-bay-500">
                        <option value="">Select city...</option>
                        {% for city in cities %}
                        <option value="{{ city }}">{{ city }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label for="price" class="block text-sm font-medium text-gray-700">Price</label>
                    <div class="mt-1 relative rounded-lg shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500 sm:text-sm">$</span>
                        </div>
                        <input type="number" name="price" id="price"
                            class="block w-full pl-7 rounded-lg border-gray-300 focus:border-south-bay-500 focus:ring-south-bay-500"
                            placeholder="2,500,000">
                    </div>
                </div>
            </div>

            <!-- Date -->
            <div>
                <label for="transaction_date" class="block text-sm font-medium text-gray-700">Transaction Date</label>
                <input type="date" name="transaction_date" id="transaction_date"
                    class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-south-bay-500 focus:ring-south-bay-500">
                <p class="mt-1 text-xs text-gray-500">Leave blank for today's date</p>
            </div>

            <!-- Notes -->
            <div>
                <label for="notes" class="block text-sm font-medium text-gray-700">Notes</label>
                <textarea name="notes" id="notes" rows="2"
                    class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-south-bay-500 focus:ring-south-bay-500"
                    placeholder="Optional notes about this transaction..."></textarea>
            </div>

            <!-- Submit -->
            <div class="flex justify-end space-x-3 pt-4">
                <a href="{{ url_for('transactions_list') }}"
                    class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit"
                    class="px-4 py-2 bg-south-bay-600 text-white rounded-lg hover:bg-south-bay-700">
                    <i class="fas fa-plus mr-2"></i>Add Transaction
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
